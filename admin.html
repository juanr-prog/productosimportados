<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración · Sabores</title><link rel="stylesheet" href="estilos.css"><style>main{max-width:1200px;margin:auto;padding:24px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}td img{width:48px;height:48px;object-fit:contain}.scroll{overflow:auto}form label{display:grid;gap:4px}form{display:grid;gap:10px}dialog{max-height:90vh;overflow:auto}input,select{padding:9px} .tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}</style><body><main><a href="index.html">← Inicio</a> · <a href="catalogo.html">Ver catálogo</a><h1>Panel de administración</h1><p>Sabores Sin Fronteras · V5.0</p><div class="notice">Administración online · Supabase.</div><div id="login"><form id="loginForm"><label>Correo<input type="email" id="email" required></label><label>Contraseña<input type="password" id="password" required></label><button>Ingresar</button></form><p id="loginStatus"></p></div><section id="panel" hidden><button id="logout">Cerrar sesión</button><div class="tools"><button id="add">+ Nuevo producto</button><input id="searchAdmin" placeholder="Buscar producto o marca"><button id="export">Exportar respaldo JSON</button><button id="csvExport">Exportar CSV (Excel)</button><button id="csvImport">Importar CSV</button><button id="backupImport">Importar JSON</button><button id="bulk">Ajustar precios %</button><button id="rename">Renombrar marca/categoría</button><input hidden type="file" id="importFile"><button id="reset">Restaurar originales</button></div><p id="status" role="status"></p><div class="scroll"><table><thead><tr><th>Foto</th><th>Producto</th><th>Marca</th><th>Precio / bulto</th><th>Vencimiento</th><th>Estado</th><th>Acción</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><dialog id="edit"><form id="form"><h2>Ficha de producto</h2><label>Nombre<input name="name" required></label><label>Marca<input name="brand" required></label><label>Categoría<input name="cat" required></label><label>Precio ARS por bulto<input name="price" type="number" min="0" step="1" required></label><label>Packing<input name="packing" required></label><label>Vencimiento<input name="expiry"></label><label>Agregar fotografías (hasta 5)<input id="photo" multiple type="file" accept="image/png,image/jpeg,image/webp"></label><div id="photos"></div><label><span>Disponible / visible</span><input name="active" type="checkbox"></label><button>Guardar cambios</button><button type="button" id="cancel">Cancelar</button></form></dialog><script src="products.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="online.js"></script><script>async function enter(){const ok=checked(await db.rpc('es_administrador'));if(!ok)throw Error('Usuario no autorizado');await refreshProducts();document.getElementById('login').hidden=true;document.getElementById('panel').hidden=false;await loadScript('admin.js')}document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();try{checked(await db.auth.signInWithPassword({email:email.value,password:password.value}));password.value='';await enter()}catch(e){document.getElementById('loginStatus').textContent=e.message}};document.getElementById('logout').onclick=async()=>{await db.auth.signOut();location.reload()};db.auth.getSession().then(r=>{if(r.data.session)enter().catch(e=>document.getElementById('loginStatus').textContent=e.message)});</script></body></html>
