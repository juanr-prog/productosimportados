<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar contraseña · Sabores</title><style>body{font:16px system-ui;background:#f4f4f4;color:#222;margin:0}main{max-width:440px;margin:8vh auto;background:white;padding:28px;border-radius:12px}label{display:block;margin:16px 0}input,button{box-sizing:border-box;width:100%;padding:12px;font:inherit}button{background:#222;color:white;border:0;border-radius:6px;cursor:pointer}button:disabled{opacity:.5}p{overflow-wrap:anywhere}</style></head><body><main><h1>Recuperar contraseña</h1><p>Sabores Sin Fronteras</p><p id="status" role="status">Cargando…</p><form id="request" hidden><label>Correo electrónico<input id="email" type="email" autocomplete="email" required></label><button>Enviar enlace de recuperación</button></form><form id="change" hidden><label>Nueva contraseña<input id="pw" type="password" autocomplete="new-password" minlength="12" required></label><label>Repetir contraseña<input id="repeat" type="password" autocomplete="new-password" minlength="12" required></label><button>Guardar nueva contraseña</button></form><p><a href="admin.html">Volver al panel</a></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const statusEl=document.getElementById('status'),request=document.getElementById('request'),change=document.getElementById('change');
const params=new URLSearchParams(location.hash.slice(1)), recovery=params.get('type')==='recovery';
if(!window.supabase){statusEl.textContent='No se pudo cargar Supabase. Revisá tu conexión y recargá.';}else{
const client=supabase.createClient('https://swtfphvkknmvvlbdadyj.supabase.co','sb_publishable_ZT4V0Vl7MJrOFB0hBbWf9Q_C2e4EnIs',{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:true}});
function ready(){request.hidden=true;change.hidden=false;statusEl.textContent='Elegí una contraseña de al menos 12 caracteres.';history.replaceState(null,'',location.pathname);}
client.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session)ready()});
client.auth.getSession().then(({data,error})=>{if(recovery&&data.session&&!error){ready();return}if(!change.hidden)return;request.hidden=false;statusEl.textContent=params.has('error')||recovery?'El enlace no es válido o venció. Solicitá uno nuevo.':'Ingresá tu correo para recibir un enlace nuevo.';if(params.has('error')||recovery)history.replaceState(null,'',location.pathname);}).catch(()=>{request.hidden=false;statusEl.textContent='No se pudo iniciar la recuperación.'});
request.onsubmit=async e=>{e.preventDefault();const b=request.querySelector('button');b.disabled=true;try{const {error}=await client.auth.resetPasswordForEmail(document.getElementById('email').value,{redirectTo:location.origin+location.pathname});statusEl.textContent=error?'No se pudo enviar el enlace. Esperá un momento e intentá nuevamente.':'Si el correo está registrado, recibirás un enlace. Abrí únicamente el más reciente.'}catch{statusEl.textContent='Error de conexión.'}finally{b.disabled=false}};
change.onsubmit=async e=>{e.preventDefault();const pw=document.getElementById('pw'),repeat=document.getElementById('repeat'),b=change.querySelector('button');if(pw.value!==repeat.value){statusEl.textContent='Las contraseñas no coinciden.';return}b.disabled=true;try{const {error}=await client.auth.updateUser({password:pw.value});if(error){statusEl.textContent=error.message;return}pw.value=repeat.value='';change.hidden=true;statusEl.textContent='Contraseña actualizada. Ya podés ingresar al panel.';await client.auth.signOut({scope:'global'});}catch{statusEl.textContent='Error de conexión. Verificá el resultado antes de reintentar.'}finally{b.disabled=false}};
}
</script></body></html>
